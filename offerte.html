<!DOCTYPE html>
<html lang="nl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offerte Aanvragen | ReBuild AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], },
                    colors: { emerald: { 400: '#34d399', 800: '#065f46', 900: '#064e3b', } }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-slate-50 text-gray-800 antialiased">

    <nav class="sticky top-0 w-full bg-white/90 backdrop-blur-md border-b border-gray-100 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <a href="index.html" class="flex-shrink-0 flex items-center gap-2 cursor-pointer hover:opacity-80 transition">
                    <i class="fa-solid fa-layer-group text-emerald-800 text-2xl"></i>
                    <span class="font-bold text-2xl tracking-tight text-emerald-900">ReBuild AI</span>
                </a>
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="index.html" class="text-gray-600 hover:text-emerald-800 font-medium transition-colors"><i class="fa-solid fa-arrow-left mr-2"></i> Terug naar Home</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="py-16 md:py-24 max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white rounded-3xl shadow-xl p-8 md:p-12 border border-gray-100">
            <div class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-extrabold text-emerald-900 mb-4">Vraag een Offerte aan</h1>
                <p class="text-gray-600">Laat ons weten wat uw projectbehoeften zijn en wij sturen u binnen 24 uur een op maat gemaakt voorstel.</p>
            </div>

            <form class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Voornaam</label>
                        <input type="text" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 focus:ring-2 focus:ring-emerald-800 outline-none transition" placeholder="Jan">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Achternaam</label>
                        <input type="text" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 focus:ring-2 focus:ring-emerald-800 outline-none transition" placeholder="De Vries">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Bedrijfsnaam</label>
                    <input type="text" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 focus:ring-2 focus:ring-emerald-800 outline-none transition" placeholder="Bouwbedrijf BV">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">E-mailadres</label>
                    <input type="email" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 focus:ring-2 focus:ring-emerald-800 outline-none transition" placeholder="jan@bouwbedrijfbv.nl">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Geschatte Projectomvang (m²)</label>
                    <select class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 focus:ring-2 focus:ring-emerald-800 outline-none transition">
                        <option>Minder dan 1.000 m²</option>
                        <option>1.000 - 5.000 m²</option>
                        <option>5.000 - 10.000 m²</option>
                        <option>Meer dan 10.000 m²</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Bericht / Toelichting</label>
                    <textarea rows="4" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 focus:ring-2 focus:ring-emerald-800 outline-none transition" placeholder="Beschrijf kort uw project..."></textarea>
                </div>

                <button type="button" class="w-full bg-emerald-800 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-emerald-900 transition-all text-lg flex items-center justify-center gap-3">
                    Aanvraag Verzenden <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
            
            <p class="mt-6 text-center text-xs text-gray-400 italic">
                <i class="fa-solid fa-shield-halved mr-1"></i> Uw gegevens worden veilig verwerkt conform onze Privacy Policy en Datasoevereiniteit-standaarden.
            </p>
        </div>
    </section>

</body>
</html>
